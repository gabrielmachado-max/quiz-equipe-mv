<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz da Equipe MV</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#0b5c75,#1687a7);
  padding:20px; color:#17313b;
}
.card{
  width:min(680px,100%); background:#fff; border-radius:24px; padding:28px;
  box-shadow:0 18px 50px rgba(0,0,0,.25);
}
.logo{font-size:14px;font-weight:bold;letter-spacing:1px;text-align:center;color:#1687a7}
h1{text-align:center;margin:8px 0 10px;font-size:32px;color:#0b5c75}
.subtitle{text-align:center;color:#64747a;margin-bottom:25px}
.progress{height:9px;background:#e8eef0;border-radius:99px;overflow:hidden;margin-bottom:24px}
.progress span{display:block;height:100%;background:#1687a7;width:0%;transition:.3s}
.question{font-size:21px;font-weight:bold;line-height:1.4;margin-bottom:20px}
.option{
  width:100%; text-align:left; padding:16px 18px; margin:10px 0; border:2px solid #dce6e9;
  border-radius:14px; background:#fff; cursor:pointer; font-size:16px; transition:.2s;
}
.option:hover{border-color:#1687a7;background:#f4fbfd}
.option:disabled{cursor:default}
.correct{background:#e7f8ed!important;border-color:#28a85b!important}
.wrong{background:#fff0f0!important;border-color:#dc4b4b!important}
.next,.start{
  width:100%; border:0; border-radius:14px; padding:16px; margin-top:15px;
  background:#0b5c75;color:#fff;font-weight:bold;font-size:17px;cursor:pointer;
}
.next:hover,.start:hover{background:#08495d}
.hidden{display:none}
#resultScreen{
  position:fixed; inset:0; z-index:50; overflow:hidden;
  border-radius:0; padding:24px;
  background-image:url('equipe_mv.jpeg');
  background-position:center top; background-size:cover; background-repeat:no-repeat;
  display:flex; align-items:flex-end; justify-content:center;
}
#resultScreen:before{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.02) 45%,rgba(0,0,0,.08) 62%,rgba(0,0,0,.20) 100%);
  z-index:1;
}
.resultPanel{
  position:relative; z-index:2; width:min(680px,100%);
  background:rgba(255,255,255,.94); backdrop-filter:blur(5px);
  border-radius:24px; padding:22px 26px 24px;
  box-shadow:0 14px 40px rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.8);
}
#resultScreen h1,#resultScreen .logo,#resultScreen .score,#resultScreen .result,#resultScreen button{position:relative;z-index:2}
#resultScreen h1{margin:6px 0 4px}
.score{text-align:center;font-size:58px;font-weight:bold;color:#0b5c75;margin:10px}
.result{text-align:center;font-size:19px;line-height:1.5}
.small{text-align:center;color:#74848a;font-size:13px;margin-top:18px}
@media (max-width:600px){
  #resultScreen{padding:14px; background-position:center top;}
  .resultPanel{border-radius:20px; padding:18px 16px 18px;}
  #resultScreen h1{font-size:27px;}
  .score{font-size:50px;margin:7px;}
  .result{font-size:17px;}
  .resultPanel .start{margin-top:10px;padding:14px;font-size:16px;}
}
</style>
</head>
<body>
<div class="card">
  <div id="startScreen">
    <div class="logo">EQUIPE MV • DESAFIO</div>
    <h1>Quiz da Equipe MV</h1>
    <p class="subtitle">Será que você conhece bem a nossa equipe?</p>
    <button class="start" onclick="startQuiz()">COMEÇAR O QUIZ 🚀</button>
    <p class="small">8 perguntas • 3 alternativas • 1 resposta correta</p>
  </div>

  <div id="quizScreen" class="hidden">
    <div class="logo" id="counter"></div>
    <div class="progress"><span id="bar"></span></div>
    <div class="question" id="question"></div>
    <div id="options"></div>
    <button id="next" class="next hidden" onclick="nextQuestion()">PRÓXIMA PERGUNTA →</button>
  </div>

  <div id="resultScreen" class="hidden">
    <div class="resultPanel">
      <div class="logo">RESULTADO</div>
      <h1>Fim do desafio! 🎉</h1>
      <div class="score" id="score"></div>
      <div class="result" id="message"></div>
      <button class="start" onclick="restart()">JOGAR NOVAMENTE</button>
    </div>
  </div>
</div>

<script>
const questions = [
 {q:"Durante o processo de Cadastramento, caso seja necessário falar sobre o Cadastro de Produtos relacionados a drogas e medicamentos, quem procurar?", a:["Alex Poatan","Marina Kruger","Gildisnei"], c:1},
 {q:"Durante o processo de Cadastramento, caso seja necessário falar sobre o Cadastro de Questões Assistenciais, quem procurar?", a:["Vin Diesel","Paula Fernandes","Gabriel Machado"], c:2},
 {q:"Durante o processo de Cadastramento, caso seja necessário falar sobre o Cadastro de Atendimento e Leitos, quem procurar?", a:["Fred Mercuri Prateado","Bruna Islabão","Padre Fabio de Melo"], c:1},
 {q:"Durante o processo de Cadastramento, caso seja necessário falar sobre o Cadastro de Faturamento, qual dupla procurar?", a:["Cilene e Jonas","Cesar Menotti e Fabiano","Henrique e Juliano"], c:0},
 {q:"Durante o processo de Cadastramento, caso seja necessário falar sobre o Cadastro de CMH, CME e Almoxarifado, quem procurar?", a:["James Hetfield","Armandinho","Felipe Anthony"], c:2},
 {q:"Durante o processo de Cadastramento, caso seja necessário falar sobre o Cadastro de Laboratório e exames, quem procurar?", a:["Paola Oliveira","Thalita Borges","Miley Cirus"], c:1},
 {q:"Durante o processo de Cadastramento, caso seja necessário falar sobre o Cadastro de Nutrição e Almoxarifado, quem procurar?", a:["Mateus Souza","Patati e Patata","Luan Santana"], c:0},
 {q:"Durante o processo de Cadastramento, caso seja necessário falar sobre as configurações do sistema, quem procurar?", a:["Stephen Hawking","João Lucas","Elon Musk"], c:1}
];

let current=0, score=0, answered=false;

function startQuiz(){
  current=0; score=0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  showQuestion();
}
function showQuestion(){
  answered=false;
  const x=questions[current];
  document.getElementById('counter').textContent=`PERGUNTA ${current+1} DE ${questions.length}`;
  document.getElementById('bar').style.width=`${(current/questions.length)*100}%`;
  document.getElementById('question').textContent=x.q;
  const box=document.getElementById('options'); box.innerHTML='';
  x.a.forEach((text,i)=>{
    const b=document.createElement('button');
    b.className='option'; b.textContent=`${String.fromCharCode(65+i)} — ${text}`;
    b.onclick=()=>answer(i,b); box.appendChild(b);
  });
  document.getElementById('next').classList.add('hidden');
}
function answer(i,clicked){
  if(answered)return;
  answered=true;
  const x=questions[current];
  document.querySelectorAll('.option').forEach((b,n)=>{
    b.disabled=true;
    if(n===x.c)b.classList.add('correct');
  });
  if(i===x.c){score++; clicked.classList.add('correct')}
  else clicked.classList.add('wrong');
  document.getElementById('bar').style.width=`${((current+1)/questions.length)*100}%`;
  document.getElementById('next').classList.remove('hidden');
}
function nextQuestion(){
  if(current<questions.length-1){current++;showQuestion();}
  else finish();
}
function finish(){
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('score').textContent=`${score} / ${questions.length}`;
  let msg;
  if(score===8) msg="🏆 Você conhece MUITO bem a Equipe MV!<br>Parabéns, gabaritou!";
  else if(score>=6) msg="⭐ Mandou muito bem! Você conhece bastante a nossa equipe.";
  else if(score>=4) msg="👍 Bom trabalho! Você já conhece bem a equipe, mas ainda pode melhorar.";
  else msg="😄 Parece que está na hora de conhecer melhor a Equipe MV!";
  document.getElementById('message').innerHTML=msg;
}
function restart(){startQuiz();}
</script>
</body>
</html>
